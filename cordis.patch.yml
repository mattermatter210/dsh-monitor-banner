- insert:
    - id: monitor-banner
      name: dsh-monitor-banner
      config:
        # One entry per log shown on the strip. Each entry takes `file` and
        # optionally `label` and `staleDays`. Leave the list empty and put it in
        # local.config.json instead if you would rather not publish a
        # machine-specific path.
        files: []
        # Legacy single-log form still works when `files` is empty:
        # file: ''
        # label: ''
        # staleDays: 7
